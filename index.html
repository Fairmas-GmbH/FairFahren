<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FairFahren — Berlin Taxi</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #bfcad6; font: 14px/1.4 system-ui, sans-serif; color: #fff; }
  canvas { display: block; width: 100%; height: 100%; }
  .panel { position: fixed; padding: 10px 14px; background: rgba(20, 24, 30, .62); border-radius: 8px; text-shadow: 0 1px 2px #000; }
  #dash { left: 16px; bottom: 16px; min-width: 180px; }
  #dash b { font-size: 40px; font-variant-numeric: tabular-nums; }
  #dash .street { color: #f5c400; font-weight: 600; min-height: 1.4em; }
  #help { right: 16px; top: 16px; font-size: 12px; opacity: .85; }
  #help kbd { background: rgba(255,255,255,.15); border-radius: 3px; padding: 0 4px; }
  #meta { left: 16px; top: 16px; font-size: 12px; opacity: .85; }
  #sensors { right: 16px; bottom: 16px; padding: 0; overflow: hidden; width: min(270px, 42vw); aspect-ratio: 9 / 11; border: 1px solid rgba(255,255,255,.12); }
  #sensors[hidden] { display: none; }
  #sensors canvas { width: 100%; height: 100%; }
  #error:not(:empty) { position: fixed; inset: 0; display: grid; place-items: center; background: #222; font-size: 18px; }
  [hidden] { display: none !important; }
  #lobby { left: 50%; top: 50%; transform: translate(-50%, -50%); min-width: 250px; }
  #lobby input, .panel button { padding: 4px 10px; border: 0; border-radius: 4px; font: inherit; }
  #joinRow { margin-top: 6px; display: flex; gap: 6px; }
  #joinRow input { width: 130px; }
  #roster { margin: 8px 0 0; padding: 0; list-style: none; }
  #startBtn { margin-top: 8px; width: 100%; }
  #netStatus { margin-top: 6px; font-size: 12px; opacity: .8; }
  #results { left: 50%; top: 18%; transform: translate(-50%, 0); min-width: 220px; }
  #results table { border-collapse: collapse; }
  #results td { padding: 1px 8px; text-align: right; }
  #results td.place { text-align: left; }
  #results tr + tr { border-top: 1px solid rgba(255,255,255,.15); }
  .dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 5px; }
  #modal { left: 50%; top: 50%; transform: translate(-50%, -50%); }
  #modal button, #againBtn { margin-top: 6px; cursor: pointer; }
  #againBtn { left: 50%; bottom: 90px; transform: translate(-50%, 0); font-weight: 600; }
  /* Race start light: glass capsule, three lamps (red, amber, green), countdown digit. */
  #startLight { position: fixed; left: 50%; top: 22px; display: flex; align-items: center; gap: 14px; padding: 12px 22px 12px 16px;
    border-radius: 99px; background: rgba(12,15,20,.55); backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,.14);
    box-shadow: 0 12px 32px rgba(0,0,0,.35); pointer-events: none; opacity: 0; transform: translate(-50%, -12px); transition: opacity .35s, transform .35s; }
  #startLight.on { opacity: 1; transform: translate(-50%, 0); }
  #startLight i { width: 30px; height: 30px; border-radius: 50%; opacity: .16; transition: opacity .15s, box-shadow .15s;
    background: radial-gradient(circle at 35% 30%, rgba(255,255,255,.6), var(--c) 45%); }
  #startLight i:nth-child(1) { --c: #ff3b30; } #startLight i:nth-child(2) { --c: #ffb300; } #startLight i:nth-child(3) { --c: #2ee06b; }
  #startLight[data-light=red] i:nth-child(1), #startLight[data-light="red+amber"] i:nth-child(-n+2), #startLight[data-light=green] i:nth-child(3) { opacity: 1; box-shadow: 0 0 20px 3px var(--c); }
  #startLight b { min-width: 2.4em; text-align: center; font: 700 30px/1 system-ui, sans-serif; font-variant-numeric: tabular-nums; }
  #startLight[data-light=green] b { color: #2ee06b; }
</style>
</head>
<body>
<canvas></canvas>
<div id="dash" class="panel">
  <div class="street" data-hud="street"></div>
  <b data-hud="speed">0</b> km/h
</div>
<div id="meta" class="panel"><strong>FairFahren</strong> · <span data-hud="seed"></span> · <span data-hud="fps"></span>
 · <span data-hud="net"></span> <b data-hud="pos"></b></div>
<div id="help" class="panel">
  <kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> / arrows drive · <kbd>Space</kbd> handbrake<br>
  <kbd>C</kbd> camera · <kbd>V</kbd> sensor view · <kbd>R</kbd> reset · <code>?seed=42</code> new city
</div>
<div id="sensors" class="panel"><canvas></canvas></div>
<div id="startLight"><i></i><i></i><i></i><b data-hud="light"></b></div>
<div id="lobby" class="panel" hidden>

  <strong>Online-Rennen</strong> <span style="opacity:.7">· <code>?online</code></span>
  <div id="joinRow">
    <input id="name" maxlength="12" placeholder="Fahrer-Name">
    <button id="joinBtn">Mitfahren</button>
  </div>
  <ul id="roster" hidden></ul>
  <button id="startBtn" hidden disabled>Rennen starten</button>
  <div id="netStatus">2–4 Fahrer</div>
</div>
<div id="results" class="panel" hidden></div>
<div id="modal" class="panel" hidden><span id="modalMsg"></span><br><button id="reloadBtn" hidden>Neu laden</button></div>
<button id="againBtn" class="panel" hidden>Nochmal</button>
<div id="error"></div>
<script type="module" src="src/main.js"></script>
</body>
</html>
